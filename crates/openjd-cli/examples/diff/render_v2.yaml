# The new side of a template edit: Render runs a different command, and an
# Encode step is added after it.
specificationVersion: jobtemplate-2023-09
name: Shot010
parameterDefinitions:
  - {name: Frames, type: STRING, default: "1-3"}
  - {name: Quality, type: STRING, default: draft}
steps:
  - name: Render
    parameterSpace:
      taskParameterDefinitions:
        - {name: Frame, type: INT, range: "{{Param.Frames}}"}
    script:
      actions:
        onRun:
          command: render-gpu
          args: ["--frame", "{{Task.Param.Frame}}", "--quality", "{{Param.Quality}}"]
  - name: Encode
    dependencies:
      - dependsOn: Render
    script:
      actions:
        onRun: {command: encode, args: ["--frames", "{{Param.Frames}}"]}
