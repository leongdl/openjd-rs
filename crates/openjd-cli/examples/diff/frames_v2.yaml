# frames.yaml with a longer default frame range and a description for Frames.
specificationVersion: jobtemplate-2023-09
name: Shot010
parameterDefinitions:
  - {name: Frames, type: STRING, default: "1-10", description: The frames to render}
steps:
  - name: Render
    parameterSpace:
      taskParameterDefinitions:
        - {name: Frame, type: INT, range: "{{Param.Frames}}"}
    script:
      actions:
        onRun: {command: render, args: ["--frame", "{{Task.Param.Frame}}"]}
